<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💳 บัตรเครดิต ตุลาคม 2569</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1b2a;--blue:#1a6faf;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;
  --gray:#6b7280;--light:#f8fafc;--white:#ffffff;
  --card-radius:16px;--shadow:0 4px 20px rgba(0,0,0,.12);
}
body{font-family:'Sarabun',system-ui,sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
/* HEADER */
.header{background:linear-gradient(135deg,#0d1b2a 0%,#1a3a5c 100%);color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.header-title{font-size:18px;font-weight:700}
.header-sub{font-size:13px;opacity:.7;margin-top:2px}
.badge-month{background:#1a6faf;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary-box{background:rgba(255,255,255,.1);border-radius:10px;padding:10px;text-align:center}
.summary-box .val{font-size:16px;font-weight:700;color:#fff}
.summary-box .lbl{font-size:10px;opacity:.7;margin-top:2px}
/* TABS */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;padding:0 12px;overflow-x:auto;gap:4px}
.tab{padding:12px 16px;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}
.tab.active{color:#1a6faf;border-bottom-color:#1a6faf}
/* PANELS */
.panel{display:none;padding:12px}
.panel.active{display:block}
/* CARD */
.pay-card{background:#fff;border-radius:var(--card-radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.pay-card-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.bank-info{display:flex;align-items:center;gap:10px}
.bank-dot{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;text-align:center;line-height:1.2}
.card-name{font-size:14px;font-weight:700;color:#1a202c}
.card-sub{font-size:11px;color:#6b7280;margin-top:1px}
.card-status-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.status-unpaid{background:#fef3c7;color:#92400e}
.status-paid{background:#dcfce7;color:#166534}
.status-pending{background:#f1f5f9;color:#64748b}
.due-overdue{color:#dc2626!important;font-weight:700}
.due-today{color:#dc2626!important;font-weight:700}
.due-tomorrow{color:#d97706!important;font-weight:700}
.due-ok{color:#16a34a!important;font-weight:600}
.due-pending{color:#9ca3af!important}
.due-line{font-size:12px;margin-top:3px}
.amt-block{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.amt-full{font-size:17px;font-weight:800;color:#1a202c;letter-spacing:-0.3px}
.amt-min{font-size:11px;color:#6b7280}
.amt-min span{font-weight:700;color:#374151}
.pay-card-body{padding:0 16px 14px;display:none}
.pay-card-body.open{display:block}
.amount-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.amount-main{font-size:28px;font-weight:800;color:#1a202c}
.amount-currency{font-size:14px;color:#6b7280;margin-left:4px}
.amount-right{text-align:right}
.min-label{font-size:10px;color:#9ca3af}
.min-val{font-size:14px;font-weight:600;color:#374151}
.due-tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin-top:4px}
.due-urgent{background:#fee2e2;color:#991b1b}
.due-soon{background:#fef3c7;color:#92400e}
.due-ok{background:#dcfce7;color:#166534}
.due-pending{background:#f1f5f9;color:#64748b}
/* TRANSACTIONS */
.section-label{font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px}
.tx-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f8fafc;gap:8px}
.tx-item:last-child{border-bottom:none}
.tx-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.tx-check{width:18px;height:18px;border:2px solid #d1d5db;border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s}
.tx-check.checked{background:#f59e0b;border-color:#f59e0b;color:#fff}
.tx-desc{font-size:12px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-date{font-size:10px;color:#9ca3af}
.tx-amount{font-size:13px;font-weight:700;color:#1a202c;flex-shrink:0;text-align:right}
.tx-amount.credit{color:#22c55e}
.tx-reimb-badge{font-size:9px;padding:2px 6px;background:#fef3c7;color:#92400e;border-radius:8px;font-weight:700;flex-shrink:0}
/* REIMBURSABLE */
.reimb-panel{background:#fffbeb;border:1px solid #f59e0b;border-radius:10px;padding:12px;margin:10px 0}
.reimb-title{font-size:12px;font-weight:700;color:#92400e;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.reimb-item{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.reimb-total{border-top:1px dashed #f59e0b;margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#92400e}
/* QR */
.qr-section{margin:10px 0}
.qr-toggle{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;color:#374151;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.qr-content{display:none;padding-top:10px;text-align:center}
.qr-content.open{display:block}
.qr-content img{max-width:200px;border:1px solid #e2e8f0;border-radius:8px;padding:8px;background:#fff}
.qr-no{color:#9ca3af;font-size:12px;padding:16px;background:#f8fafc;border-radius:8px;text-align:center}
/* ACTIONS */
.action-row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-pay{background:#22c55e;color:#fff}
.btn-pay:active{background:#16a34a}
.btn-pay.paid-done{background:#dcfce7;color:#166534}
.btn-upload{background:#f1f5f9;color:#374151;border:1px solid #e2e8f0}
.btn-upload:active{background:#e2e8f0}
/* COPY BOX */
.copy-box{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.copy-val{font-size:12px;color:#374151;font-family:monospace;word-break:break-all}
.copy-btn{background:#1a6faf;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0;white-space:nowrap}
/* SLIP */
.slip-preview{margin-top:8px;text-align:center}
.slip-preview img{max-width:100%;max-height:200px;border-radius:8px;border:1px solid #e2e8f0}
/* PENDING CARD */
.pending-body{padding:14px 16px;color:#94a3b8;font-size:13px;text-align:center}
.pending-body .upload-stmt{background:#f8fafc;border:2px dashed #cbd5e1;border-radius:10px;padding:20px;cursor:pointer;transition:.2s}
.pending-body .upload-stmt:hover{background:#f1f5f9}
/* REIMBURSABLE TAB */
.reimb-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.reimb-card-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.reimb-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #f8fafc}
.reimb-summary-total{background:linear-gradient(135deg,#92400e,#d97706);color:#fff;border-radius:12px;padding:14px;text-align:center;margin-bottom:12px}
/* RESPONSIVE */
@media(min-width:640px){
  .panel{padding:16px 24px}
  .summary-grid{grid-template-columns:repeat(3,1fr)}
  .amount-main{font-size:32px}
}
</style>

const MONTH = 'oct2026';

function fmt(n){
  if(n===0) return '฿0';
  const abs = Math.abs(n);
  const s = abs.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'-':'')+' ฿'+s;
}
function fmtShort(n){
  return '฿'+Math.abs(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function getState(id){
  try{return JSON.parse(localStorage.getItem(MONTH+'_'+id))||{paid:false,reimbs:{},slip:null};}
  catch{return {paid:false,reimbs:{},slip:null};}
}
function saveState(id,state){
  localStorage.setItem(MONTH+'_'+id,JSON.stringify(state));
}

function getDueClass(due){
  if(!due) return 'due-pending';
  const d=new Date(due+'T00:00:00'), now=new Date();
  now.setHours(0,0,0,0);
  const diff=Math.round((d-now)/(1000*60*60*24));
  if(diff<0)  return 'due-overdue';
  if(diff===0) return 'due-today';
  if(diff===1) return 'due-tomorrow';
  return 'due-ok';
}
function getDueLabel(due, dueClass, due_th){
  if(!due) return '';
  const icons={'due-overdue':'❗','due-today':'🔴','due-tomorrow':'🟡','due-ok':'🟢'};
  const labels={'due-overdue':'เลยกำหนด!','due-today':'ครบกำหนดวันนี้','due-tomorrow':'ครบกำหนดพรุ่งนี้','due-ok':''};
  return (icons[dueClass]||'') + ' ' + due_th + (labels[dueClass]?' · <b>'+labels[dueClass]+'</b>':'');
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active',['pay','reimb','history'][i]===t);
  });
  ['pay','reimb','history'].forEach(p=>{
    document.getElementById('panel-'+p).classList.toggle('active',p===t);
  });
  if(t==='reimb') renderReimb();
}

function toggleCard(id){
  const body=document.getElementById('body-'+id);
  const arrow=document.getElementById('arrow-'+id);
  body.classList.toggle('open');
  arrow.textContent=body.classList.contains('open')?'▲':'▼';
}

function toggleQR(id){
  const c=document.getElementById('qr-'+id);
  const btn=document.getElementById('qrbtn-'+id);
  c.classList.toggle('open');
  btn.querySelector('span').textContent=c.classList.contains('open')?'ซ่อน QR':'แสดง QR สแกนจ่าย';
}

function toggleReimb(cardId, idx){
  const state=getState(cardId);
  state.reimbs[idx]=!state.reimbs[idx];
  saveState(cardId,state);
  const el=document.getElementById('reimb-check-'+cardId+'-'+idx);
  if(el) el.classList.toggle('checked',!!state.reimbs[idx]);
  updateHeader();
}

function markPaid(cardId){
  const state=getState(cardId);
  state.paid=!state.paid;
  saveState(cardId,state);
  const btn=document.getElementById('paybtn-'+cardId);
  const badge=document.getElementById('badge-'+cardId);
  const card=CARDS.find(c=>c.id===cardId);
  if(state.paid){
    btn.textContent='✅ ชำระแล้ว';
    btn.classList.add('paid-done');
    if(badge){badge.textContent='ชำระแล้ว';badge.className='card-status-badge status-paid';}
  }else{
    btn.textContent='✔ ทำเครื่องหมายว่าชำระแล้ว';
    btn.classList.remove('paid-done');
    if(badge){badge.textContent='ยังไม่ชำระ';badge.className='card-status-badge status-unpaid';}
  }
  updateHeader();
}

function copyText(text,btnId){
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById(btnId);
    if(btn){const orig=btn.textContent;btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent=orig,1500);}
  });
}

function uploadSlip(cardId){
  const input=document.createElement('input');
  input.type='file';input.accept='image/*';
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const state=getState(cardId);
      state.slip=ev.target.result;
      saveState(cardId,state);
      renderSlip(cardId,ev.target.result);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function renderSlip(cardId,dataUrl){
  const el=document.getElementById('slip-'+cardId);
  if(el) el.innerHTML=dataUrl?`<img src="${dataUrl}" alt="slip">`:'';
}

function updateHeader(){
  let total=0,paid=0,active=0,reimbTotal=0;
  CARDS.forEach(c=>{
    if(c.status==='pending') return;
    active++;
    const state=getState(c.id);
    if(!state.paid) total+=c.total;
    if(state.paid) paid++;
    c.transactions.forEach((t,i)=>{
      if(t.reimb && state.reimbs[i]!==false) reimbTotal+=t.amount;
      else if(t.reimb && state.reimbs[i]===true) reimbTotal+=t.amount;
    });
  });
  // calc reimb
  reimbTotal=0;
  CARDS.forEach(c=>{
    c.transactions.forEach((t,i)=>{
      if(t.reimb){
        const state=getState(c.id);
        if(state.reimbs[i]!==false) reimbTotal+=t.amount;
      }
    });
  });
  document.getElementById('hd-total').textContent=fmtShort(total);
  document.getElementById('hd-paid').textContent=paid+'/'+active;
  document.getElementById('hd-reimb').textContent=fmtShort(reimbTotal);
}

    // load slip
    if(state.slip) setTimeout(()=>renderSlip(c.id,state.slip),50);

function renderReimb(){
  let html='';
  let grandTotal=0;
  CARDS.forEach(c=>{
    const items=c.transactions.filter(t=>t.reimb);
    if(!items.length) return;
    const state=getState(c.id);
    let sum=0;
    let rows='';
    items.forEach((t,i)=>{
      const origIdx=c.transactions.indexOf(t);
      const checked=state.reimbs[origIdx]!==false;
      if(checked) sum+=t.amount;
      rows+=`<div class="reimb-row"><span>${t.desc} (${t.date})</span><span style="font-weight:700">${fmtShort(t.amount)}</span></div>`;
    });
    grandTotal+=sum;
    html+=`
    <div class="reimb-card">
      <div class="reimb-card-title">
        <span style="color:${c.color}">${c.bank} ...${c.last4}</span>
        <span style="color:#92400e">${fmtShort(sum)}</span>
      </div>
      ${rows}
    </div>`;
  });
  if(!grandTotal){
    html='<div style="text-align:center;padding:30px;color:#9ca3af">ไม่มีรายการเบิก Office เดือนนี้</div>';
  }else{
    html=`<div class="reimb-summary-total">
      <div style="font-size:12px;opacity:.8;margin-bottom:4px">รวมยอดเบิก Office ทั้งหมด</div>
      <div style="font-size:28px;font-weight:800">฿${grandTotal.toLocaleString('th-TH',{minimumFractionDigits:2})}</div>
      <div style="font-size:11px;opacity:.7;margin-top:4px">ตุลาคม 2569</div>
    </div>`+html;
  }
  document.getElementById('panel-reimb').innerHTML=html;
}

// INIT
renderCards();

// ============================================================
// GAS Sync — อ่าน/เขียน สถานะการชำระจาก Google Sheet
// ============================================================
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbxbgBq0xCtx4WElbww6lg0sfBEK-9h7TaFw9qP98Q7ryN4UacjBAecVngZeND0lPNGb/exec';
const GAS_MONTH = 'ตุลาคม 2569';

async function gasLoad() {
  try {
    const url = GAS_URL + '?month=' + encodeURIComponent(GAS_MONTH);
    const res  = await fetch(url);
    const data = await res.json();
    if (data.found && data.cards) {
      data.cards.forEach(gc => {
        const card = CARDS.find(c => c.card_name === gc.card_name);
        if (card) {
          card.status    = gc.status === 'ชำระแล้ว' ? 'paid' : 'unpaid';
          card.paid_date = gc.paid_date || '';
          // sync ลง localStorage ด้วย
          localStorage.setItem('oct2026_'+card.id, card.status);
        }
      });
      console.log('[GAS] synced', data.cards.length, 'cards');
    }
  } catch(e) { console.warn('[GAS] load failed (offline?)', e.message); }
  renderAll();
}

async function gasSave(cardId, newStatus) {
  const card = CARDS.find(c => c.id === cardId);
  if (!card) return;
  const paid_date = newStatus === 'paid'
    ? new Date().toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'})
    : '';
  const body = {
    month:     GAS_MONTH,
    card_name: card.card_name,
    status:    newStatus === 'paid' ? 'ชำระแล้ว' : 'รอชำระ',
    paid_date
  };
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    console.log('[GAS] saved', card.card_name, newStatus);
  } catch(e) { console.warn('[GAS] save failed', e.message); }
}
